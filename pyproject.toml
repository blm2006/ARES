[project]
name = "yolo-al"
version = "0.1.0"
description = "YOLO person detection + tracking với vòng lặp active learning, chạy local"
requires-python = ">=3.11"
dependencies = [
  "ultralytics>=8.3.0",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "redis>=5.0",
  "SQLAlchemy>=2.0",
  "faiss-cpu>=1.8",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "nvidia-ml-py>=12.535",
  "paho-mqtt>=2.0",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "realtime", "collector", "worker", "review", "dataset", "training", "deploy", "scripts", "ares", "ares.dashboard"]

[tool.setuptools.package-data]
"ares.dashboard" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
