# Cấu hình Mosquitto cho ARES.
#
# BẮT BUỘC có tài khoản (không cho kết nối ẩn danh). Tạo tệp mật khẩu MỘT LẦN, từ thư mục gốc dự án
# (PowerShell), thay <mat_khau> bằng mật khẩu của bạn:
#
#   docker run --rm -v "${PWD}/deploy/mosquitto:/mosquitto/config" eclipse-mosquitto:2 `
#       mosquitto_passwd -c -b /mosquitto/config/passwd ares <mat_khau>
#
# Thêm tài khoản riêng cho từng ESP32 (bỏ -c để không ghi đè tệp):
#
#   docker run --rm -v "${PWD}/deploy/mosquitto:/mosquitto/config" eclipse-mosquitto:2 `
#       mosquitto_passwd -b /mosquitto/config/passwd esp32-cam-bien <mat_khau_2>
#
# Sau đó khai báo trong ares_config/ares.env:  ARES_MQTT_USERNAME=ares  và  ARES_MQTT_PASSWORD=<mat_khau>
# Tệp "passwd" chứa băm mật khẩu, KHÔNG commit lên git.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

# Gói retain (lệnh đèn/điều hòa mới nhất) tồn tại qua lần khởi động lại broker.
log_dest stdout
connection_messages true
